spring:
  application:
    name: trektrace
  datasource:
    url: jdbc:mysql://localhost:3306/trektrace?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://10.0.2.2:8081}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000  # 7 days in milliseconds
  refresh-expiration: 2592000000  # 30 days in milliseconds

sms:
  provider: ${SMS_PROVIDER:mock}  # mock / aliyun / tencent
  aliyun:
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
    signName: ${ALIYUN_SMS_SIGN_NAME:}
    templateCode: ${ALIYUN_SMS_TEMPLATE_CODE:}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

mail:
  provider: ${MAIL_PROVIDER:mock}
  base-url: ${MAIL_BASE_URL:http://localhost:8080}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:noreply@trektrace.com}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:whd123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-!!}
  refresh-expiration: 2592000000
mail:
  provider: ${MAIL_PROVIDER:mock}
  base-url: ${MAIL_BASE_URL:http://localhost:8080}
  from: ${SMTP_FROM:noreply@trektrace.com}
