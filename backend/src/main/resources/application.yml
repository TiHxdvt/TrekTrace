spring:
  application:
    name: trektrace
  datasource:
    url: jdbc:mysql://localhost:3306/trektrace?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://10.0.2.2:8081}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000  # 7 days in milliseconds

sms:
  provider: ${SMS_PROVIDER:mock}  # mock / aliyun / tencent
  aliyun:
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
    signName: ${ALIYUN_SMS_SIGN_NAME:}
    templateCode: ${ALIYUN_SMS_TEMPLATE_CODE:}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:whd123456}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
jwt:
  secret: dev-only-secret-key-do-not-use-in-production-32ch
