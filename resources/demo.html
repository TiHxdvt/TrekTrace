<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>途迹 TrekTrace - 运动记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* G2 椭圆圆角系统 */
        .g2-xs {
            border-radius: 4px / 5px;
        }
        .g2-sm {
            border-radius: 8px / 10px;
        }
        .g2-md {
            border-radius: 12px / 14px;
        }
        .g2-lg {
            border-radius: 16px / 20px;
        }
        .g2-xl {
            border-radius: 24px / 28px;
        }
        .g2-2xl {
            border-radius: 32px / 40px;
        }
        .g2-3xl {
            border-radius: 40px / 48px;
        }
        .g2-phone {
            border-radius: 48px / 56px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-br from-gray-500/0 via-gray-500/10 to-gray-500/0 p-4">

    <!-- Background Ambience -->
    <div class="fixed pointer-events-none z-0 inset-0">
        <div class="absolute top-[-10%] left-[10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[10%] w-[600px] h-[600px] bg-purple-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute top-[40%] left-[50%] transform -translate-x-1/2 w-[400px] h-[400px] bg-pink-500/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- Phone Container -->
    <div class="overflow-hidden flex flex-col bg-[#1c1e26]/60 w-full h-[780px] max-w-[360px] border-white/10 border g2-phone relative shadow-2xl backdrop-blur-2xl">

        <!-- Dynamic Background Elements -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 pt-5 pb-2 text-white/80 text-xs font-medium z-20 select-none">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
                <iconify-icon icon="solar:signal-linear" class="text-sm"></iconify-icon>
                <iconify-icon icon="solar:wifi-linear" class="text-sm"></iconify-icon>
                <iconify-icon icon="solar:battery-charge-linear" class="text-lg"></iconify-icon>
            </div>
        </div>

        <!-- Header -->
        <div class="px-6 py-4 flex items-center justify-between z-20">
            <div>
                <h1 class="text-white text-xl font-semibold tracking-tight">运动记录</h1>
                <p class="text-white/50 text-xs mt-0.5">开始你的户外之旅</p>
            </div>
            <button class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white border border-white/5 hover:bg-white/10 transition">
                <iconify-icon icon="solar:settings-linear" class="text-xl"></iconify-icon>
            </button>
        </div>

        <!-- Map Area -->
        <div class="mx-6 h-[280px] g2-2xl overflow-hidden relative z-20">
            <!-- Map Placeholder -->
            <div class="absolute inset-0 bg-gradient-to-br from-[#1a1d24] to-[#0f1015]">
                <!-- Simulated Map Grid -->
                <div class="absolute inset-0 opacity-20">
                    <div class="absolute top-1/4 left-1/4 w-32 h-32 border border-white/10 g2-xs"></div>
                    <div class="absolute top-1/2 left-1/3 w-24 h-24 border border-white/10 g2-xs"></div>
                    <div class="absolute top-1/3 right-1/4 w-20 h-20 border border-white/10 g2-xs"></div>
                </div>
                <!-- Simulated Route Line -->
                <svg class="absolute inset-0 w-full h-full" viewBox="0 0 360 280">
                    <path
                        d="M 60 200 Q 100 180 120 150 T 180 120 T 240 140 T 300 100"
                        fill="none"
                        stroke="rgba(59, 130, 246, 0.8)"
                        stroke-width="4"
                        stroke-linecap="round"
                        class="drop-shadow-lg"
                    />
                    <!-- Current Position Dot -->
                    <circle cx="300" cy="100" r="8" fill="#3b82f6" class="drop-shadow-lg"/>
                    <circle cx="300" cy="100" r="12" fill="rgba(59, 130, 246, 0.3)"/>
                </svg>
            </div>

            <!-- Map Overlay Badge -->
            <div class="absolute top-4 left-4 flex items-center gap-1 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10">
                <iconify-icon icon="solar:map-point-linear" class="text-blue-400 text-sm"></iconify-icon>
                <span class="text-white text-xs font-medium">GPS 信号良好</span>
            </div>

            <!-- Map Controls -->
            <div class="absolute right-4 bottom-4 flex flex-col gap-2">
                <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white border border-white/10 hover:bg-black/60 transition">
                    <iconify-icon icon="solar:magnifer-linear" class="text-lg"></iconify-icon>
                </button>
                <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white border border-white/10 hover:bg-black/60 transition">
                    <iconify-icon icon="solar:focus-linear" class="text-lg"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- Sport Type Selector -->
        <div class="overflow-x-auto no-scrollbar z-20 mt-6 px-6">
            <div class="flex gap-4" id="sportSelector">
                <!-- Hiking (Active) -->
                <div onclick="selectSport(this)" class="flex flex-col items-center gap-1 relative cursor-pointer transition-all duration-300 opacity-100" data-active="true">
                    <div class="w-14 h-14 g2-lg bg-gradient-to-b from-blue-500 to-blue-700 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/25 transform scale-105">
                        <iconify-icon icon="solar:mountains-linear"></iconify-icon>
                    </div>
                    <span class="text-[10px] text-white font-medium">徒步</span>
                    <div class="w-1 h-1 bg-blue-400 rounded-full absolute -bottom-2"></div>
                </div>

                <!-- Running -->
                <div onclick="selectSport(this)" class="flex flex-col gap-1 hover:opacity-100 transition opacity-50 items-center cursor-pointer duration-300">
                    <div class="w-14 h-14 g2-lg bg-white/5 border border-white/5 flex items-center justify-center text-white text-2xl transition-all duration-300">
                        <iconify-icon icon="solar:running-round-linear"></iconify-icon>
                    </div>
                    <span class="text-[10px] text-white font-medium">跑步</span>
                </div>

                <!-- Cycling -->
                <div onclick="selectSport(this)" class="flex flex-col gap-1 hover:opacity-100 transition opacity-50 items-center cursor-pointer duration-300">
                    <div class="w-14 h-14 g2-lg bg-white/5 border border-white/5 flex items-center justify-center text-white text-2xl transition-all duration-300">
                        <iconify-icon icon="solar:bicycling-round-linear"></iconify-icon>
                    </div>
                    <span class="text-[10px] text-white font-medium">骑行</span>
                </div>
            </div>
        </div>

        <!-- Stats Panel (Glassmorphism) -->
        <div class="mx-6 mt-6 bg-white/10 backdrop-blur-xl g2-2xl border border-white/10 p-5 z-20">
            <div class="grid grid-cols-3 gap-4">
                <!-- Distance -->
                <div class="text-center">
                    <p class="text-white/40 text-[10px] uppercase tracking-wider font-medium">距离</p>
                    <p class="text-white text-2xl font-semibold mt-1">0.0</p>
                    <p class="text-white/50 text-xs">公里</p>
                </div>
                <!-- Duration -->
                <div class="text-center">
                    <p class="text-white/40 text-[10px] uppercase tracking-wider font-medium">时长</p>
                    <p class="text-white text-2xl font-semibold mt-1" id="timerDisplay">00:00</p>
                    <p class="text-white/50 text-xs">分:秒</p>
                </div>
                <!-- Elevation -->
                <div class="text-center">
                    <p class="text-white/40 text-[10px] uppercase tracking-wider font-medium">海拔</p>
                    <p class="text-white text-2xl font-semibold mt-1">128</p>
                    <p class="text-white/50 text-xs">米</p>
                </div>
            </div>

            <!-- Pace Display -->
            <div class="mt-4 pt-4 border-t border-white/10 flex justify-between items-center">
                <div>
                    <p class="text-white/40 text-[10px] uppercase tracking-wider font-medium">配速</p>
                    <p class="text-white text-lg font-medium mt-0.5">--:-- <span class="text-xs text-white/50">/公里</span></p>
                </div>
                <div class="text-right">
                    <p class="text-white/40 text-[10px] uppercase tracking-wider font-medium">爬升</p>
                    <p class="text-white text-lg font-medium mt-0.5">0 <span class="text-xs text-white/50">米</span></p>
                </div>
            </div>
        </div>

        <!-- Start Button -->
        <div class="mt-auto px-6 pb-24 z-20">
            <button id="startBtn" onclick="toggleRecording()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white text-base font-medium py-4 g2-lg shadow-lg shadow-blue-600/30 hover:shadow-blue-500/40 transition-all active:scale-[0.98]">
                <div class="flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:play-circle-bold" class="text-xl"></iconify-icon>
                    <span>开始记录</span>
                </div>
            </button>
        </div>

        <!-- Bottom Navigation -->
        <div class="-translate-x-1/2 flex z-30 bg-[#181a22]/80 w-[85%] h-16 border-white/10 border rounded-full pr-2 pl-2 absolute bottom-8 left-1/2 shadow-2xl backdrop-blur-xl items-center justify-between" id="bottomNav">
            <button onclick="selectNav(this)" class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30" data-active="true">
                <iconify-icon icon="solar:running-round-linear" class="text-xl"></iconify-icon>
            </button>
            <button onclick="selectNav(this)" class="w-12 h-12 rounded-full flex items-center justify-center text-white/50 hover:text-white transition">
                <iconify-icon icon="solar:clock-circle-linear" class="text-xl"></iconify-icon>
            </button>
            <button onclick="selectNav(this)" class="w-12 h-12 rounded-full flex items-center justify-center text-white/50 hover:text-white transition">
                <iconify-icon icon="solar:chart-linear" class="text-xl"></iconify-icon>
            </button>
            <button onclick="selectNav(this)" class="w-12 h-12 rounded-full flex items-center justify-center text-white/50 hover:text-white transition">
                <iconify-icon icon="solar:user-circle-linear" class="text-xl"></iconify-icon>
            </button>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full pointer-events-none z-40"></div>
    </div>

    <script>
        // Sport Type Selector
        function selectSport(element) {
            const container = element.parentElement;
            Array.from(container.children).forEach(child => {
                const icon = child.firstElementChild;
                const dot = child.querySelector('.w-1.h-1');

                if (child === element) {
                    child.style.opacity = '1';
                    icon.className = 'w-14 h-14 g2-lg bg-gradient-to-b from-blue-500 to-blue-700 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/25 transform scale-105 transition-all duration-300';

                    if (!dot) {
                        const newDot = document.createElement('div');
                        newDot.className = 'w-1 h-1 bg-blue-400 rounded-full absolute -bottom-2';
                        child.appendChild(newDot);
                    }
                } else {
                    child.style.opacity = '0.5';
                    icon.className = 'w-14 h-14 g2-lg bg-white/5 border border-white/5 flex items-center justify-center text-white text-2xl transition-all duration-300';
                    if (dot) dot.remove();
                }
            });
        }

        // Bottom Navigation
        function selectNav(element) {
            const nav = element.parentElement;
            Array.from(nav.children).forEach(btn => {
                if (btn === element) {
                    btn.className = 'w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30 transition';
                } else {
                    btn.className = 'w-12 h-12 rounded-full flex items-center justify-center text-white/50 hover:text-white transition';
                }
            });
        }

        // Start/Pause Button
        let isRecording = false;
        let timer = null;
        let seconds = 0;

        function toggleRecording() {
            const btn = document.getElementById('startBtn');
            const icon = btn.querySelector('iconify-icon');
            const text = btn.querySelector('span');

            if (!isRecording) {
                // Start recording
                isRecording = true;
                icon.setAttribute('icon', 'solar:pause-circle-bold');
                text.textContent = '暂停';
                btn.className = 'w-full bg-gradient-to-r from-orange-600 to-orange-500 text-white text-base font-medium py-4 g2-lg shadow-lg shadow-orange-600/30 hover:shadow-orange-500/40 transition-all active:scale-[0.98]';

                // Start timer
                timer = setInterval(() => {
                    seconds++;
                    updateTimerDisplay();
                }, 1000);
            } else {
                // Pause recording
                isRecording = false;
                icon.setAttribute('icon', 'solar:play-circle-bold');
                text.textContent = '继续';
                btn.className = 'w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white text-base font-medium py-4 g2-lg shadow-lg shadow-blue-600/30 hover:shadow-blue-500/40 transition-all active:scale-[0.98]';

                // Stop timer
                clearInterval(timer);
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const display = document.getElementById('timerDisplay');
            if (display) {
                display.textContent = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }
    </script>
</body>
</html>
